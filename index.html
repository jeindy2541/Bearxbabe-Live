<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>🔥 Bearxbabe Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div id="toast" class="toast hidden"></div>
<div id="floatLayer" class="float-layer"></div>

<!-- ═══ LOGIN ═══ -->
<section id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">🔥</div>
    <h1 class="login-title">Bearxbabe Live</h1>
    <p class="login-sub">ห้องฟังเพลงร่วมกัน · เลือก Avatar แล้วเข้าห้องได้เลย</p>
    <input id="nameInput" maxlength="20" placeholder="ชื่อของคุณ..." autocomplete="off" class="login-input"/>
    <p class="section-label">เลือก Avatar</p>
    <div class="emoji-tabs">
      <button class="etab active" data-group="all">ทั้งหมด</button>
      <button class="etab" data-group="face">หน้า</button>
      <button class="etab" data-group="music">เพลง</button>
      <button class="etab" data-group="animal">สัตว์</button>
      <button class="etab" data-group="fire">เท่</button>
    </div>
    <div id="emojiGrid" class="emoji-grid"></div>
    <div class="preview-wrap">
      <div class="preview-avatar">
        <div class="fig-head"><span id="previewEmoji">😎</span></div>
        <div class="fig-body"></div>
        <div class="fig-legs"><div></div><div></div></div>
      </div>
      <div class="preview-name" id="previewName">คุณ</div>
    </div>
    <button id="joinBtn" class="btn-join">เข้าห้อง Live 🎵</button>
  </div>
</section>

<!-- ═══ APP ═══ -->
<div id="app" class="app hidden">

  <!-- TOP INFO BAR (like Plug.dj left panel) -->
  <div class="top-bar">
    <div class="tb-brand">
      <span class="tb-fire">🔥</span>
      <span class="tb-name">Bearxbabe Live</span>
    </div>
    <div class="tb-dj-info">
      <div class="tb-row"><span class="tb-lbl">CURRENT DJ</span></div>
      <div id="hostBadge" class="tb-dj-name">Host</div>
      <div class="tb-row"><span class="tb-lbl">NOW PLAYING</span></div>
      <div id="nowTitle" class="tb-song-title">ยังไม่มีเพลง</div>
      <div id="nowBy" class="tb-song-by"></div>
    </div>
    <div class="tb-crowd">
      <div class="crowd-stat">
        <span class="crowd-icon">❤️</span>
        <span id="wootCount" class="crowd-num">0</span>
      </div>
      <div class="crowd-stat">
        <span class="crowd-icon">💔</span>
        <span id="mehCount" class="crowd-num">0</span>
      </div>
      <div class="crowd-stat">
        <span class="crowd-icon">⭐</span>
        <span id="myPoints" class="crowd-num">0</span>
        <span class="crowd-lbl">XP</span>
      </div>
    </div>
    <div class="tb-right">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText" class="status-text">เชื่อมต่อ...</span>
      <span id="meLabel" class="tb-me"></span>
    </div>
  </div>

  <!-- MAIN: 3 columns -->
  <div class="main-wrap">

    <!-- LEFT PANEL -->
    <aside class="left-panel">
      <div class="panel-tabs">
        <button class="ptab active" data-tab="queue">🎵 Up Next <span id="queueCount" class="badge">0</span></button>
        <button class="ptab" data-tab="waitlist">📋 Waitlist <span id="waitlistCount" class="badge">0</span></button>
      </div>
      <div id="tabQueue" class="tab-pane active">
        <div id="queueList" class="queue-list"></div>
        <div class="add-box">
          <input id="youtubeInput" placeholder="วาง YouTube URL..." autocomplete="off"/>
          <button id="addSongBtn" class="btn-add">+</button>
        </div>
      </div>
      <div id="tabWaitlist" class="tab-pane">
        <div id="waitlistInfo" class="waitlist-info hidden"></div>
        <div id="waitlistList" class="queue-list"></div>
        <button id="joinWaitlistBtn" class="btn-join-wl">+ เข้าคิว DJ</button>
      </div>
    </aside>

    <!-- CENTER: video top, stage bottom -->
    <section class="center-wrap">

      <!-- VIDEO ROW -->
      <div class="video-row">
        <div class="player-card">
          <div class="player-wrap">
            <div id="player"></div>
            <div class="player-blocker"></div>
            <div id="clickToStart" class="click-start hidden">
              <button class="btn-unmute">▶ เปิดเสียง</button>
            </div>
          </div>
          <div class="progress-row">
            <span id="currentTimeText" class="t-txt">0:00</span>
            <div class="prog-track"><div id="progressBar" class="prog-fill"></div><div id="progressDot" class="prog-dot"></div></div>
            <span id="durationText" class="t-txt">0:00</span>
          </div>
        </div>

        <!-- VOTE panel next to video -->
        <div class="vote-panel">
          <button class="vote-btn meh" id="mehBtn" data-reaction="meh">
            <span class="vb-icon">💔</span>
            <span class="vb-label">MEH</span>
            <span id="mehCount2" class="vb-count">0</span>
          </button>
          <div class="dj-mini-info">
            <div id="djMiniAvatar" class="dj-mini-av"></div>
            <div id="djMiniName" class="dj-mini-name">DJ</div>
            <div class="dj-mini-stats">
              <span>⭐ <span id="djPoints">0</span></span>
              <span>👥 <span id="onlineCount">0</span></span>
            </div>
          </div>
          <button class="vote-btn woot" id="wootBtn" data-reaction="woot">
            <span class="vb-icon">❤️</span>
            <span class="vb-label">WOOT!</span>
            <span id="wootCount2" class="vb-count">0</span>
          </button>
        </div>
      </div>

      <!-- REACT BAR -->
      <div class="react-bar">
        <button class="react-btn" data-reaction="like">👍 <span id="likeCount">0</span></button>
        <button class="react-btn" data-reaction="love">❤️ <span id="loveCount">0</span></button>
        <button class="react-btn" data-reaction="fire">🔥 <span id="fireCount">0</span></button>
        <button class="react-btn" data-reaction="wow">😮 <span id="wowCount">0</span></button>
        <div style="flex:1"></div>
        <img id="coverImage" class="mini-cover" src="" alt=""/>
      </div>

      <!-- STAGE (full width, Plug.dj style) -->
      <div class="stage">
        <!-- Sky background -->
        <div class="stage-sky"></div>
        <!-- Stage floor -->
        <div class="stage-floor"></div>
        <!-- Spotlight -->
        <div class="stage-spotlight"></div>

        <!-- Audience (behind DJ) -->
        <div id="audienceRow" class="audience-row"></div>

        <!-- DJ Booth center bottom -->
        <div class="dj-booth">
          <div class="booth-desk"></div>
          <div id="djFigureWrap" class="dj-figure-wrap">
            <!-- DJ figure injected by JS -->
          </div>
          <div id="djNameTag" class="dj-name-tag hidden"></div>
        </div>

        <!-- Woot/Meh big buttons at bottom -->
        <div class="stage-vote-row">
          <button class="stage-vote meh" id="stageMehBtn">💔 MEH</button>
          <button class="stage-vote woot" id="stageWootBtn">❤️ WOOT!</button>
        </div>

        <div class="stage-tag">🎤 Bearxbabe Live</div>
      </div>

    </section>

    <!-- RIGHT: Chat -->
    <aside class="right-panel">
      <div class="panel-hd">💬 Chat <span id="chatDot" class="status-dot live" style="margin-left:6px"></span></div>
      <div id="chatBox" class="chat-box"></div>
      <div class="chat-foot">
        <input id="chatInput" placeholder="พิมพ์ข้อความ..." maxlength="300" autocomplete="off"/>
        <button id="sendChatBtn" class="btn-send">ส่ง</button>
      </div>
    </aside>

  </div><!-- /main-wrap -->
</div><!-- /app -->

<script src="app.js"></script>
</body>
</html>
